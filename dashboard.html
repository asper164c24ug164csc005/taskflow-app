<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard — TaskFlow</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="topnav">
  <div class="wordmark">TaskFlow</div>
  <nav>
    <a href="index.html">Home</a>
    <a href="dashboard.html" class="active">Dashboard</a>
  </nav>
</header>

<main class="container">

  <div class="dash-header">
    <div>
      <h1>Your tasks</h1>
      <div class="subtitle">Everything you're working on, in one place.</div>
    </div>
    <button id="toggle-add-form" class="btn-primary">+ Add task</button>
  </div>

  <div class="stat-row">
    <div class="stat-card"><div class="value" id="stat-total">0</div><div class="label">Total tasks</div></div>
    <div class="stat-card"><div class="value" id="stat-open">0</div><div class="label">Open</div></div>
    <div class="stat-card"><div class="value" id="stat-done">0</div><div class="label">Completed</div></div>
    <div class="stat-card"><div class="value" id="stat-high">0</div><div class="label">High priority, open</div></div>
  </div>

  <form id="add-task-form" class="add-task-form">
    <div class="row">
      <div class="form-field">
        <label for="new-title">Title</label>
        <input type="text" id="new-title" placeholder="What needs doing?" required>
      </div>
    </div>
    <div class="row">
      <div class="form-field">
        <label for="new-priority">Priority</label>
        <select id="new-priority">
          <option value="low">Low</option>
          <option value="medium" selected>Medium</option>
          <option value="high">High</option>
        </select>
      </div>
      <div class="form-field">
        <label for="new-due">Due date</label>
        <input type="date" id="new-due">
      </div>
    </div>
    <div class="row">
      <div class="form-field">
        <label for="new-notes">Notes (optional)</label>
        <textarea id="new-notes" rows="2" placeholder="Any context worth remembering"></textarea>
      </div>
    </div>
    <button type="submit" class="btn-primary">Save task</button>
  </form>

  <div class="toolbar">
    <input type="text" id="search-input" placeholder="Search tasks…">
    <div class="filters">
      <button class="filter-chip active" data-filter="all">All</button>
      <button class="filter-chip" data-filter="open">Open</button>
      <button class="filter-chip" data-filter="done">Done</button>
      <button class="filter-chip" data-filter="high">High priority</button>
    </div>
  </div>

  <div id="task-list" class="task-list"></div>

</main>

<footer class="site-footer">
  <div class="container">TaskFlow — a front-end demo built for the Week 2 assignment.</div>
</footer>

<script src="js/app.js"></script>
<script>initDashboard();</script>
</body>
</html>
