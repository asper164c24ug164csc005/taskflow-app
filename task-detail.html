<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Task detail — TaskFlow</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="topnav">
  <div class="wordmark">TaskFlow</div>
  <nav>
    <a href="index.html">Home</a>
    <a href="dashboard.html">Dashboard</a>
  </nav>
</header>

<main class="container" id="detail-wrap">
  <div class="breadcrumb"><a href="dashboard.html">← Back to dashboard</a></div>

  <div class="detail-card">
    <div class="detail-header">
      <div>
        <h1 id="detail-title">Task title</h1>
        <label style="display:flex; align-items:center; gap:0.5rem; margin-top:0.6rem; font-size:0.9rem; color:var(--ink-soft);">
          <input type="checkbox" id="detail-status-checkbox" style="width:18px; height:18px;">
          <span id="detail-status-label">In progress</span>
        </label>
      </div>
      <button id="delete-task" class="btn-ghost">Delete task</button>
    </div>

    <div class="detail-meta-grid">
      <div>
        <div class="label">Title</div>
        <input type="text" id="detail-title-input" style="width:100%;">
      </div>
      <div>
        <div class="label">Priority</div>
        <select id="detail-priority" style="width:100%;">
          <option value="low">Low</option>
          <option value="medium">Medium</option>
          <option value="high">High</option>
        </select>
      </div>
      <div>
        <div class="label">Due date</div>
        <input type="date" id="detail-due" style="width:100%;">
      </div>
    </div>

    <div class="detail-notes">
      <label for="detail-notes">Notes</label>
      <textarea id="detail-notes" placeholder="Add context, links, or a plan for this task…"></textarea>
    </div>

    <div class="detail-actions">
      <span class="save-hint" id="save-hint">Saved</span>
    </div>
  </div>
</main>

<footer class="site-footer">
  <div class="container">TaskFlow — a front-end demo built for the Week 2 assignment.</div>
</footer>

<script src="js/app.js"></script>
<script>initTaskDetail();</script>
</body>
</html>
